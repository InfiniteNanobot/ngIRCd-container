# Minimal standalone server. Review these settings before exposing it.
[Global]
    Name = irc.example.test
    Info = Private IRC server
    Network = PrivateIRC
    Listen = 0.0.0.0
    Ports = 6667
    MotdFile = /etc/ngircd.motd
    PidFile = /run/ngircd/ngircd.pid

[Options]
    DNS = no
    Ident = no
    PAM = no
